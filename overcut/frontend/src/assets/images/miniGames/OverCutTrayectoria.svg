<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="OverCut Trayectoria">
  <title>OverCut Trayectoria</title>
  <defs>
    <clipPath id="tr-thumb-clip">
      <rect width="320" height="200" />
    </clipPath>
  </defs>

  <g clip-path="url(#tr-thumb-clip)">
    <rect width="320" height="200" fill="#10294F" />
    <!-- The OverCut diagonal. -->
    <path d="M320 0 L320 200 L96 200 Z" fill="#F2B705" />

    <!-- A season strip: the game's signature element, in miniature. -->
    <g transform="translate(22 44)">
      <rect x="0" y="0" width="18" height="18" fill="none" stroke="#F3F1E9" stroke-opacity="0.35" />
      <rect x="23" y="0" width="18" height="18" fill="none" stroke="#F2B705" />
      <rect x="46" y="0" width="18" height="18" fill="#F3F1E9" fill-opacity="0.18" stroke="#F3F1E9" stroke-opacity="0.4" />
      <rect x="69" y="0" width="18" height="18" fill="#F2B705" />
      <rect x="92" y="0" width="18" height="18" fill="none" stroke="#C42B2B" />
      <line x1="92" y1="18" x2="110" y2="0" stroke="#C42B2B" stroke-width="1.6" />
      <rect x="115" y="0" width="18" height="18" fill="#F2B705" />
      <rect x="138" y="0" width="18" height="18" fill="none" stroke="#F2B705" />
    </g>

    <text x="22" y="112" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="15" font-weight="700"
          letter-spacing="4" fill="#F2B705">OVERCUT</text>
    <text x="22" y="152" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="38" font-weight="900"
          letter-spacing="-1.6" fill="#F3F1E9">TRAYEC-</text>
    <text x="22" y="186" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="38" font-weight="900"
          letter-spacing="-1.6" fill="#0A0A0C">TORIA</text>

    <!-- Helmet mark, sitting on the gold side. -->
    <g transform="translate(228 24) scale(1.35)">
      <path d="M32 6c14 0 22 9 22 22 0 6-1 10-3 14H35l-2-7H16c-6 0-10-5-10-13C6 15 17 6 32 6Z"
            fill="#F3F1E9" stroke="#0A0A0C" stroke-width="2.4" />
      <path d="M16 24h20l3 12H18c-4 0-6-3-6-7s2-5 4-5Z" fill="#0A0A0C" />
    </g>
  </g>
</svg>
