# OverCut frontend: cache and compression hints for nginx (RNF-03, RNF-04).
#
# Include inside the `server { }` that serves the CRA build (overcut/frontend/build).
# Measured locally on 2026-11-22: with these headers a reload of the manager
# transfers ~0 KB of JS and no GLB (Cache Storage + HTTP cache), and the first
# visit downloads ~1.4 MB less JS on pages that are not the manager.

# Content types three.js needs (KTX2Loader streams the wasm; Chrome refuses
# WebAssembly.instantiateStreaming without application/wasm).
types {
    model/gltf-binary  glb;
    image/ktx2         ktx2;
    application/wasm   wasm;
}

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
# JSON chunks (season packs, splines) and the Basis wasm compress 5-10x; GLB and
# KTX2 are already Meshopt/Basis-compressed, so they are left out.
gzip_types application/javascript text/css application/json application/wasm image/svg+xml;
# With ngx_brotli available, prefer it for the same types:
# brotli on; brotli_comp_level 5; brotli_types application/javascript text/css application/json application/wasm image/svg+xml;

# index.html must always be revalidated: it names the hashed chunks of the build.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Hashed CRA chunks (main, overcut-manager, manager-hub, manager-weekend,
# season-YYYY, three.js...): the name changes with the content.
location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Manager assets. The game always requests them as `<file>?v=<manifest hash>`
# (three/assets/manifest.js assetUrl), and a rebuilt manifest changes the hash,
# so a long, immutable cache is safe. The runtime also keeps them in Cache
# Storage keyed by the same hash (three/assets/cacheStore.js).
location /manager-assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
    # Range requests let the browser resume a 20 MB circuit after a dropped connection.
    max_ranges 1;
}

# The Basis transcoder is requested without the hash: cache it, but revalidate weekly.
location /manager-assets/basis/ {
    add_header Cache-Control "public, max-age=604800";
    add_header Access-Control-Allow-Origin "*";
}
