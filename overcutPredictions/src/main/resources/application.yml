server:
  port: 8085
  servlet:
    context-path: /overcutPredictions

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/f1db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root      # <-- cámbialo si tienes otro usuario
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false

  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
